name: dmv_practice_test
description: "DMV Practice Test app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  go_router: ^18.1.4
  dio: ^5.11.1
  retrofit: ^4.10.0
  json_annotation: ^4.12.0
  easy_localization: ^3.0.8
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.10
  retrofit_generator: ^10.3.3
  json_serializable: ^6.15.2
  freezed: ^4.0.0-dev.3

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
